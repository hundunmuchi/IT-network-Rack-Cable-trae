# LibreNMS Nginx 站点参考配置
# 部署脚本会按检测到的路径自动生成，本文件仅作参考/存档。
# 实际生效位置:
#   rpm 系: /etc/nginx/conf.d/librenms.conf
#   deb 系: /etc/nginx/sites-available/librenms.conf -> sites-enabled

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /opt/librenms/html;   # 部署脚本按 LNMS_DIR 替换
    index index.php;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/x-javascript image/svg+xml text/plain text/xsd text/xsl text/xml image/x-icon;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /api/v0 {
        try_files $uri $uri/ /api_v0.php?$query_string;
    }
    location ~ \.php {
        include fastcgi.conf;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php-fpm/librenms.sock;   # deb 系为 /run/php/librenms.sock
    }
    location ~ /\.ht {
        deny all;
    }
}
