# LibreNMS PHP-FPM 池参考配置
# 部署脚本会按检测到的路径自动写入，本文件仅作参考。
# 实际生效位置:
#   rpm 系: /etc/php-fpm.d/librenms.conf
#   deb 系: /etc/php/<ver>/fpm/pool.d/librenms.conf

[librenms]
user = nginx          # deb 系为 www-data
group = nginx
listen = /run/php-fpm/librenms.sock     # deb 系为 /run/php/librenms.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 10
pm.max_requests = 500
catch_workers_output = yes
php_admin_value[error_log] = /opt/librenms/logs/php-fpm-error.log
php_admin_flag[log_errors] = on
